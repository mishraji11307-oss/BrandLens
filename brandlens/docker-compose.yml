version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: brandlens-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brandlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandlens_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-brandlens_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandlens -d brandlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandlens-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://brandlens:brandlens_secure_2026@db:5432/brandlens_db
      SECRET_KEY: ${SECRET_KEY:-brandlens-production-jwt-secret-key-inkloom-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ENABLE_PUBLIC_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandlens-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

